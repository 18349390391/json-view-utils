<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- 设计源文件：实际 icns 由 Resources/render_icon.swift 按同一设计生成（保证透明无白边） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64A8FF"/>
      <stop offset="1" stop-color="#2F5FE0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.38" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="1" x2="0" y2="0.6">
      <stop offset="0" stop-color="#0D1F66" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#0D1F66" stop-opacity="0"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#152E73" flood-opacity="0.40"/>
    </filter>
  </defs>
  <!-- macOS 图标网格：内容区 824x824 居中 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shade)"/>
  <!-- 白色线条：花括号 × 放大镜，带投影 -->
  <g fill="none" stroke="#FFFFFF" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" filter="url(#lift)">
    <path d="M 380 300 Q 310 300 310 370 L 310 450 L 245 500 L 310 550 L 310 630 Q 310 700 380 700"/>
    <circle cx="600" cy="465" r="185"/>
    <path d="M 735 600 L 845 710"/>
    <path d="M 505 340 Q 560 340 560 390 L 560 430 L 615 470 L 560 510 L 560 550 Q 560 600 505 600"/>
    <path d="M 378 286 L 410 318"/>
    <path d="M 378 644 L 410 612"/>
  </g>
</svg>
